name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        type: choice
        required: true
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          fetch-depth: 0

      - name: Compute next version, pin internal refs, and tag
        env:
          BUMP: ${{ inputs.bump }}
          REPOREF: dice-group/cpp-conan-release-reusable-workflow
        run: scripts/release-create.sh

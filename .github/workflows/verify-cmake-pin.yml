name: Verify get-cmake pin freshness

on:
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-conan-branch-package.yml'
      - '.github/workflows/abi-diff.yml'
      - 'renovate.json'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check lukka/get-cmake pin covers the latest CMake release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pins=$(grep -hoE 'lukka/get-cmake@v[0-9.]+' .github/workflows/*.yml | sed 's/.*@//' | sort -u)
          pin_count=$(echo "$pins" | wc -l)
          if [ "$pin_count" -ne 1 ]; then
            echo "::error::Expected exactly one lukka/get-cmake pin across .github/workflows/*.yml, found: $(echo "$pins" | tr '\n' ' ')"
            exit 1
          fi
          pin="$pins"

          supported=$(curl -fsSL "https://raw.githubusercontent.com/lukka/get-cmake/${pin}/.latest_cmake_version")
          latest=$(curl -fsSL -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/repos/Kitware/CMake/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"v?([^"]+)".*/\1/')

          echo "lukka/get-cmake pin: ${pin} (supports CMake up to ${supported})"
          echo "Latest published CMake release: ${latest}"

          newest=$(printf '%s\n%s\n' "$supported" "$latest" | sort -V | tail -n1)
          if [ "$newest" != "$supported" ]; then
            echo "::error::lukka/get-cmake@${pin} only supports CMake up to ${supported}, but CMake ${latest} has been released. Bump the lukka/get-cmake pin in .github/workflows/*.yml (Renovate PR expected under the 'cmake version tracking' group)."
            exit 1
          fi

          echo "OK: lukka/get-cmake@${pin} already covers the latest CMake release."
